<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <filter id="noteShadow" x="-10%" y="-10%" width="120%" height="135%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="6"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <radialGradient id="pinGrad" cx="35%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#7fa3d8"/>
      <stop offset="55%" stop-color="#4a6fa5"/>
      <stop offset="100%" stop-color="#3a5a8a"/>
    </radialGradient>

    <linearGradient id="foldGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c9a838"/>
      <stop offset="100%" stop-color="#e0bc4a"/>
    </linearGradient>
  </defs>

  <!-- Sticky note with drop shadow -->
  <g filter="url(#noteShadow)">
    <rect x="32" y="104" width="192" height="124" rx="8" fill="#ffe678"/>
  </g>

  <!-- Folded corner (bottom-right) -->
  <path d="M 200 228 L 216 228 Q 224 228 224 220 L 224 204 Z" fill="url(#foldGrad)"/>

  <!-- Subtle text lines (fade at small sizes) -->
  <g stroke="#c9a838" stroke-width="4" stroke-linecap="round" opacity="0.4">
    <line x1="56" y1="148" x2="200" y2="148"/>
    <line x1="56" y1="176" x2="176" y2="176"/>
    <line x1="56" y1="204" x2="156" y2="204"/>
  </g>

  <!-- Pushpin contact shadow on note -->
  <ellipse cx="128" cy="110" rx="24" ry="4" fill="#000" opacity="0.28"/>

  <!-- Pushpin needle (tapered) -->
  <polygon points="122,88 134,88 130,108 126,108" fill="#2c4470"/>

  <!-- Pushpin head -->
  <circle cx="128" cy="66" r="26" fill="url(#pinGrad)"/>

  <!-- Pushpin specular highlight -->
  <ellipse cx="119" cy="56" rx="10" ry="6" fill="#ffffff" opacity="0.7"/>
</svg>
